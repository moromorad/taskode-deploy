services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn myproject.wsgi:application --bind 0.0.0.0:8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis
      - chromadb
    env_file:
      - .env

  celery_worker:
    build: .
    command: celery -A myproject worker -l INFO
    volumes:
      - .:/app
    depends_on:
      - redis
      - web
      - chromadb
    env_file:
      - .env

volumes:
  chroma_data: